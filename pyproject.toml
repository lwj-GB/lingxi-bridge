[project]
name = "lingxi-bridge"
version = "0.2.2"
description = "Local-first relationship evidence workspace"
requires-python = ">=3.11"

[project.scripts]
lingxi = "lingxi.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "apps/server"}

[tool.setuptools.packages.find]
where = ["apps/server"]

[tool.setuptools.package-data]
"lingxi.analysis" = ["*.R"]

[tool.pytest.ini_options]
pythonpath = [
  "apps/server"
]
testpaths = [
  "tests/contracts",
  "apps/server/tests",
  "tests/acceptance"
]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
