components:
  schemas:
    AnalysisTemplateDefinition:
      properties:
        id:
          type: string
          maxLength: 80
          minLength: 3
          pattern: ^[a-z0-9][a-z0-9_-]*$
          title: Id
        name:
          type: string
          maxLength: 80
          minLength: 1
          title: Name
        category:
          type: string
          enum:
          - general
          - romantic
          - family
          - education
          - friendship
          - workplace
          - professional_support
          title: Category
        description:
          type: string
          maxLength: 400
          minLength: 1
          title: Description
        dimensions:
          items:
            type: string
            maxLength: 240
            minLength: 1
          type: array
          maxItems: 12
          minItems: 1
          title: Dimensions
        evidence_requirements:
          items:
            type: string
            maxLength: 240
            minLength: 1
          type: array
          maxItems: 8
          minItems: 1
          title: Evidence Requirements
        forbidden_conclusions:
          items:
            type: string
            maxLength: 240
            minLength: 1
          type: array
          maxItems: 8
          minItems: 1
          title: Forbidden Conclusions
        template_family:
          type: string
          enum:
          - person_long_term
          - relation
          - recent_change
          - special
          title: Template Family
        template_variant:
          type: string
          enum:
          - overview
          - preferences_habits
          - experiences_values
          - romantic
          - family_parent
          - mentor_collaboration
          - friend_social
          - other
          - recent_state
          - gift_advice
          - communication_prep
          - conflict_review
          - behavior_interpretation
          - custom
          title: Template Variant
        default_question:
          type: string
          maxLength: 2000
          minLength: 1
          title: Default Question
      type: object
      required:
      - id
      - name
      - category
      - description
      - dimensions
      - evidence_requirements
      - forbidden_conclusions
      - template_family
      - template_variant
      - default_question
      title: AnalysisTemplateDefinition
    AnalysisTemplatesUpdate:
      properties:
        active_template_id:
          type: string
          maxLength: 80
          minLength: 3
          title: Active Template Id
        custom_templates:
          items:
            $ref: '#/components/schemas/AnalysisTemplateDefinition'
          type: array
          maxItems: 50
          title: Custom Templates
        expected_hash:
          anyOf:
          - type: string
            maxLength: 64
            minLength: 64
            pattern: ^[a-f0-9]{64}$
          - type: 'null'
          title: Expected Hash
      type: object
      required:
      - active_template_id
      title: AnalysisTemplatesUpdate
    AssistantPersonCreate:
      properties:
        text:
          type: string
          maxLength: 2000000
          minLength: 1
          title: Text
        preview:
          additionalProperties: true
          type: object
          title: Preview
        display_name:
          type: string
          maxLength: 120
          minLength: 1
          title: Display Name
        relation_to_user:
          type: string
          maxLength: 120
          minLength: 1
          title: Relation To User
        request_id:
          type: string
          format: uuid
          title: Request Id
      additionalProperties: false
      type: object
      required:
      - text
      - preview
      - display_name
      - relation_to_user
      - request_id
      title: AssistantPersonCreate
    AssistantQuestion:
      properties:
        question:
          type: string
          maxLength: 20000
          minLength: 1
          title: Question
        person_id:
          type: string
          format: uuid
          title: Person Id
        source_ids:
          items:
            type: string
            format: uuid
          type: array
          maxItems: 100
          title: Source Ids
        engine:
          type: string
          enum:
          - claude
          - codex
          title: Engine
        profile_id:
          type: string
          const: inherited
          title: Profile Id
          default: inherited
      type: object
      required:
      - question
      - person_id
      - engine
      title: AssistantQuestion
    Body_import_screenshot_batch_api_screenshot_batches_post:
      properties:
        title:
          type: string
          maxLength: 200
          minLength: 1
          title: Title
        person_ids:
          type: string
          title: Person Ids
        event_ids:
          type: string
          title: Event Ids
          default: '[]'
        files:
          items:
            type: string
            contentMediaType: application/octet-stream
          type: array
          title: Files
      type: object
      required:
      - title
      - person_ids
      - files
      title: Body_import_screenshot_batch_api_screenshot_batches_post
    ChatAnalysisCreate:
      properties:
        engine:
          type: string
          enum:
          - local_demo
          - claude
          - codex
          title: Engine
          default: local_demo
        profile_id:
          type: string
          maxLength: 120
          minLength: 1
          title: Profile Id
          default: inherited
        material_scope_confirmed:
          type: boolean
          title: Material Scope Confirmed
          default: false
      type: object
      title: ChatAnalysisCreate
    EventCreate:
      properties:
        title:
          type: string
          maxLength: 200
          minLength: 1
          title: Title
        occurred_at:
          type: string
          minLength: 1
          title: Occurred At
        person_ids:
          items:
            type: string
            format: uuid
          type: array
          minItems: 1
          title: Person Ids
      type: object
      required:
      - title
      - occurred_at
      - person_ids
      title: EventCreate
    EvidenceCreate:
      properties:
        source_id:
          type: string
          format: uuid
          title: Source Id
        quote:
          type: string
          minLength: 1
          title: Quote
        locator:
          $ref: '#/components/schemas/EvidenceLocator'
        evidence_kind:
          type: string
          enum:
          - direct_quote
          - user_observation
          - user_statement
          - third_party_statement
          title: Evidence Kind
        reliability:
          type: string
          enum:
          - low
          - medium
          - high
          title: Reliability
        person_ids:
          items:
            type: string
